<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iwong | Personal Page</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0d0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 680px;
            width: 100%;
            margin: auto;
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #d4af37;
            margin-bottom: 1.2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .brand-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-transform: lowercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0aec0;
            font-weight: 300;
            margin-bottom: 1.8rem;
        }

        .widget-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #d4af37;
            padding: 1rem;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
            color: #cbd5e1;
            font-style: italic;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .extra-message {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 2rem;
            line-height: 1.6;
            text-align: center;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .link-card:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
        }

        .iframe-container {
            margin-top: 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .iframe-container h3 {
            font-size: 1rem;
            color: #d4af37;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        iframe {
            width: 100%;
            height: 520px;
            border: none;
            border-radius: 10px;
            overflow: hidden;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        @media (max-width: 480px) {
            .brand-title { font-size: 3rem; }
            .subtitle { font-size: 0.95rem; }
            .widget-bar { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- STATUS BADGE -->
        <div class="status-badge">
            <span class="dot"></span> <span id="txtStatus"></span>
        </div>

        <!-- HEADER -->
        <h1 class="brand-title">iwong</h1>
        <p id="txtSubtitle" class="subtitle"></p>

        <!-- JAM REAL-TIME -->
        <div class="widget-bar">
            <span><i class="far fa-clock"></i> <span id="clock">00:00:00 WIB</span></span>
            <span><i class="far fa-calendar-alt"></i> <span id="date">-- --- ----</span></span>
        </div>

        <!-- QUOTE BOX -->
        <div id="txtQuote" class="quote-box"></div>

        <!-- PESAN TAMBAHAN -->
        <p id="txtPesanTambahan" class="extra-message"></p>

        <!-- DAFTAR TAUTAN -->
        <div id="linksContainer" class="links-wrapper"></div>

        <!-- KALKULATOR IFRAME -->
        <div class="iframe-container">
            <h3><i class="fas fa-calculator" style="margin-right: 8px;"></i> Tools & Utility</h3>
            <iframe src="kalkulator.html" title="Kalkulator Lembur Harian" scrolling="no"></iframe>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="txtFooter"></footer>

    <!-- MEMANGGIL FILE DATA DAN MENGISI TEKS OTOMATIS -->
    <script src="data.js"></script>
    <script>
        // Masukkan data dari data.js ke elemen HTML
        document.getElementById('txtStatus').textContent = pageData.statusText;
        document.getElementById('txtSubtitle').textContent = pageData.subtitle;
        document.getElementById('txtQuote').textContent = `"${pageData.quote}"`;
        document.getElementById('txtPesanTambahan').textContent = pageData.pesanTambahan;
        document.getElementById('txtFooter').textContent = pageData.footer;

        // Render tombol link secara otomatis
        const linksContainer = document.getElementById('linksContainer');
        pageData.links.forEach(item => {
            const a = document.createElement('a');
            a.href = item.url;
            a.target = "_blank";
            a.className = "link-card";
            a.innerHTML = `
                <span><i class="${item.icon}" style="margin-right: 10px;"></i> ${item.title}</span>
                <i class="fas fa-arrow-right" style="font-size: 0.8rem; color: #d4af37;"></i>
            `;
            linksContainer.appendChild(a);
        });

        // Script Jam Real-Time
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const dateOptions = { day: 'numeric', month: 'short', year: 'numeric' };
            
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID', timeOptions) + " WIB";
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
