<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iwong | Personal Page</title>
    
    <!-- Google Fonts untuk Tipografi Elegan -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0d0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* CONTAINER UTAMA */
        .container {
            max-width: 680px;
            width: 100%;
            margin: auto;
            text-align: center;
        }

        /* HEADER & BRANDING */
        .brand-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-transform: lowercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0aec0;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        /* TOMBOL TAUTAN / LINK TREE STYLE */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .link-card {
            display: block;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .link-card:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
        }

        /* FOOTER */
        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        /* RESPONSIF UNTUK HP */
        @media (max-width: 480px) {
            .brand-title {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <h1 class="brand-title">IWONG</h1>
        <p class="subtitle">Digital Craftsman & Developer</p>

        <!-- TULIS KATA-KATA ANDA DI SINI -->
        <p style="color: #cbd5e1; margin-bottom: 2rem; line-height: 1.6;">
        Sepanjang hidup itu belajar.
<br>Selamat Datang, <br>Kembangkan ide secara konsisten biarkan karya berbicara.<br>*(untuk kalkulator lembur hanya perhitungan di indonesia sesuai ketentuan)*
    </p>

        <!-- DAFTAR TAUTAN (Mudah ditambah/diedit) -->
        <div class="links-wrapper">
            <a href="https://wanzmaulana.wordpress.com" target="_blank" class="link-card">
                My Blog
            </a>
            <a href="https://github.com/iwong90" target="_blank" class="link-card">
                GitHub Profile
            </a>
            <a href="kalkulator.html" class="link-card">
                Kalkulator Lembur
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 iwong. All rights reserved.
    </footer>

</body>
</html>
