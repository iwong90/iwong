<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Lembur Harian</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 10px;
            margin: 0;
        }
        .calculator-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            margin: 0 auto;
        }
        .calculator-card h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 12px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: #1e1e1e;
            color: #ffffff;
            border-radius: 5px;
            display: none;
            font-size: 13px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .result-row.total {
            border-top: 1px solid #444;
            padding-top: 8px;
            font-weight: bold;
            color: #4caf50;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Kalkulator Lembur Harian</h2>
    
    <div class="form-group">
        <label for="gaji_pokok">Gaji Pokok (Rp)</label>
        <input type="text" id="gaji_pokok" placeholder="Contoh: 3.965.881" onkeyup="formatRupiahInput(this)">
    </div>

    <div class="form-group">
        <label for="jam_lembur">Lembur Berapa Jam Hari Ini?</label>
        <input type="number" id="jam_lembur" step="0.5" placeholder="Contoh: 2">
    </div>

    <button onclick="hitungLemburHarian()">Hitung Lembur Hari Ini</button>

    <!-- TULISAN PEMBERITAHUAN (DISCLAIMER) -->
    <p style="font-size: 11px; color: #777; text-align: center; margin-top: 10px; line-height: 1.4;">
        *Perhitungan ini mungkin tidak akurat 100%, untuk lebih lanjutnya silahkan hubungi staff masing-masing untuk info lebih akurat.
    </p>

    <div id="resultBox" class="result-box">
        <div class="result-row">
            <span>UPAH / JAM</span>
            <span id="resUpahJam">Rp 0</span>
        </div>
        <div class="result-row">
            <span id="lblOt150">LEMBUR OT 150%</span>
            <span id="resOt150">Rp 0</span>
        </div>
        <div class="result-row">
            <span id="lblOt200">LEMBUR OT 200%</span>
            <span id="resOt200">Rp 0</span>
        </div>
        <div class="result-row total">
            <span>DAPAT HARI INI</span>
            <span id="resTotal">Rp 0</span>
        </div>
    </div>
        <!-- FOOTER DI DALAM CARD -->
  <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; text-align: center; font-size: 11px; color: #888;">
            &copy; 2026 iwong. Created by iwong.
 </div>

</div>

<script>
// Format titik ribuan otomatis saat mengetik angka gaji
function formatRupiahInput(input) {
    let value = input.value.replace(/\D/g, '');
    if (value) {
        input.value = parseInt(value, 10).toLocaleString('id-ID');
    } else {
        input.value = '';
    }
}

function hitungLemburHarian() {
    const gajiRaw = document.getElementById('gaji_pokok').value.replace(/\./g, '');
    const gaji = parseFloat(gajiRaw) || 0;
    const jamLembur = parseFloat(document.getElementById('jam_lembur').value) || 0;

    if (gaji <= 0 || jamLembur <= 0) {
        alert("Harap isi Gaji Pokok dan Jam Lembur dengan benar!");
        return;
    }

    // Upah Dasar per Jam (Gaji / 173)
    const upahPerJam = gaji / 173;

    // Pemisahan Jam Lembur 150% dan 200%
    let jamOt150 = 0;
    let jamOt200 = 0;

    if (jamLembur <= 1) {
        jamOt150 = jamLembur;
        jamOt200 = 0;
    } else {
        jamOt150 = 1; // Jam ke-1 bernilai 1.5x
        jamOt200 = jamLembur - 1; // Jam ke-2 dan seterusnya bernilai 2x
    }

    // Hitung Jam Setara (Konversi Slip Gaji)
    const jamSetara150 = jamOt150 * 1.5;
    const jamSetara200 = jamOt200 * 2.0;

    // Nominal Rupiah
    const nominalOt150 = Math.round(jamSetara150 * upahPerJam);
    const nominalOt200 = Math.round(jamSetara200 * upahPerJam);
    const totalDapat = nominalOt150 + nominalOt200;

    const formatRp = (val) => "Rp " + Math.round(val).toLocaleString('id-ID');

    // Tampilkan Hasil
    document.getElementById('resUpahJam').innerText = formatRp(upahPerJam);
    document.getElementById('lblOt150').innerText = `LEMBUR OT 150% (${jamOt150.toFixed(1)} = ${jamSetara150.toFixed(1)})`;
    document.getElementById('resOt150').innerText = formatRp(nominalOt150);
    
    document.getElementById('lblOt200').innerText = `LEMBUR OT 200% (${jamOt200.toFixed(1)} = ${jamSetara200.toFixed(1)})`;
    document.getElementById('resOt200').innerText = formatRp(nominalOt200);

    document.getElementById('resTotal').innerText = formatRp(totalDapat);

    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
